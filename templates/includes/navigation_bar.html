<header class="navbar navbar-expand-md d-print-none py-3">
	<div class="container-xl position-relative">
		<div class="position-absolute start-50 top-50 translate-middle d-flex gap-2 z-3">
			<a href="https://github.com/kuligambino01/it_company_task_manager"
			   target="_blank" rel="noopener noreferrer"
			   aria-label="GitHub repository">
				<span class="social social-app-github"></span>
			</a>
			<a href="https://www.linkedin.com/in/cezary-kulig-03b184269/"
			   target="_blank" rel="noopener noreferrer"
			   aria-label="LinkedIn profile">
				<span class="social social-app-linkedin"></span>
			</a>
		</div>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
		        data-bs-target="#navbar-menu" aria-controls="navbar-menu"
		        aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<a href="{% url 'task:dashboard' %}" aria-label="Task Manager"
		   class="navbar-brand navbar-brand-autodark me-3">
			<svg xmlns="http://www.w3.org/2000/svg" width="170" height="32"
			     viewBox="0 0 360 68" class="navbar-brand-image" aria-hidden="true">

				<rect x="2" y="2" width="64" height="64" rx="15"
				      fill="var(--tblr-primary, #206bc4)"/>

				<rect x="16" y="13" width="36" height="42" rx="6"
				      fill="none" stroke="#fff" stroke-width="4"/>

				<path d="M22 27l5 5 7-9M39 27h8M22 40l5 5 7-9M39 40h8M39 51h8"
				      fill="none" stroke="#fff" stroke-width="4"
				      stroke-linecap="round" stroke-linejoin="round"/>

				<circle cx="27" cy="51" r="2.5" fill="#fff"/>

				<text x="82" y="46" font-family="Inter, Arial, sans-serif"
				      font-size="32" font-weight="700" fill="currentColor">
					Task Manager
				</text>
			</svg>
		</a>
		{% if user.is_authenticated %}
			<div class="navbar-nav flex-row order-md-last">
				<div class="nav-item dropdown">
					<a href="#" class="nav-link d-flex lh-1 text-reset p-0"
					   data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar avatar-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               width="100%" height="100%" fill="none" stroke="currentColor"
               stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </span>
						<div class="d-none d-xl-block ps-2">
							<div>{{ user.username }}</div>
							<div class="mt-1 small text-secondary">{{ user.position }}</div>
						</div>
					</a>
					<div class="dropdown-menu dropdown-menu-end">
						<a href="{% url 'task:task-list' %}" class="dropdown-item">Task list</a>
						<a href="{% url 'task:task-create' %}" class="dropdown-item">Task create</a>
						<div class="dropdown-divider"></div>
						<form method="post" action="{% url 'logout' %}">
							{% csrf_token %}
							<button type="submit" class="dropdown-item">Logout</button>
						</form>
					</div>
				</div>
			</div>
		{% endif %}
	</div>
</header>
