{% extends "base.html" %}

{% block title %}Logged out | Task Manager{% endblock %}

{% block content %}
  <div class="container-tight py-4">
    <div class="card card-md">
      <div class="card-body text-center py-5">

        <div class="mb-3">
          <span class="avatar avatar-xl bg-blue-lt">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 12h12"/>
              <path d="M18 9l3 3l-3 3"/>
              <path d="M13 5v-2a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/>
            </svg>
          </span>
        </div>

        <h2 class="mb-2">You have been logged out</h2>

        <p class="text-secondary mb-4">
          Your session has ended successfully.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary">
          Log in again
        </a>
      </div>
    </div>
  </div>
{% endblock %}
