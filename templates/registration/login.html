{% extends "base.html" %}


{% block title %}
	<h1 class="login">Login</h1>
{% endblock %}

{% block content %}
	{% if form.errors %}
		<p>Please provide correct credentials</p>
	{% endif %}

	{% if next %}
		<p>Please provide ur credentials to login</p>
	{% endif %}

	<form method="post" action={% url 'login' %}>
		{% csrf_token %}
		{{ form.as_p }}
		<input value="Login" type="submit">
		<input type="hidden" name="next" value="{{ next }}"/>
	</form>
{% endblock %}
